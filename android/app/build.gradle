plugins {
    id "com.android.application"
}

configurations.configureEach {
    resolutionStrategy {
        force(
            "org.jetbrains.kotlin:kotlin-stdlib:1.8.22",
            "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22",
            "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
        )
    }
}

android {
    namespace "com.smartpos.sunmi"
    compileSdk 34

    defaultConfig {
        applicationId "com.smartpos.sunmi"
        minSdk 23
        targetSdk 30
        versionCode 1
        versionName "1.0.0"

        def webUrl = project.findProperty("SMARTPOS_WEB_URL") ?: "https://frontend.smartpos-webhooks.workers.dev"
        buildConfigField "String", "SMARTPOS_WEB_URL", "\"${webUrl}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.core:core:1.13.1"
}
